<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parqueadero Inteligente · PARKING-001</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0E1318;
    --panel: #161D24;
    --panel-2: #1B232C;
    --border: #232C36;
    --text: #E7ECEF;
    --muted: #7E8A96;
    --disponible: #3FCF8E;
    --reservada: #E8A63D;
    --ocupada: #E4514F;
    --lcd-bg: #0A1F16;
    --lcd-text: #8CFFC1;
  }

  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .app{
    max-width: 1320px;
    margin: 0 auto;
    padding: 22px 22px 32px;
  }

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 16px;
    flex-wrap: wrap;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 18px;
  }

  header h1{
    font-size: 20px;
    font-weight: 700;
    margin:0;
    letter-spacing: 0.2px;
  }
  header h1 span{
    color: var(--muted);
    font-weight: 500;
    font-size: 14px;
    margin-left: 10px;
  }

  .live{
    display:flex; align-items:center; gap:8px;
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }
  .live .dot{
    width:8px; height:8px; border-radius:50%;
    background: var(--muted);
  }
  .live.on .dot{
    background: var(--disponible);
    box-shadow: 0 0 0 0 rgba(63,207,142,.6);
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse{
    0%{ box-shadow: 0 0 0 0 rgba(63,207,142,.55); }
    70%{ box-shadow: 0 0 0 8px rgba(63,207,142,0); }
    100%{ box-shadow: 0 0 0 0 rgba(63,207,142,0); }
  }
  .live.on{ color: var(--disponible); }

  .controls{
    display:flex;
    flex-wrap: wrap;
    gap: 18px 26px;
    align-items:end;
    padding: 14px 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 18px;
  }
  .field{
    display:flex;
    flex-direction: column;
    gap: 6px;
    min-width: 120px;
  }
  .field label{
    font-size: 11px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
  }
  .field .val{
    color: var(--text);
    font-weight: 600;
  }
  input[type="number"]{
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 8px;
    font-family: 'JetBrains Mono', monospace;
    width: 80px;
  }
  input[type="range"]{
    width: 140px;
    accent-color: var(--disponible);
  }
  .buttons{
    display:flex; gap:8px; margin-left:auto;
  }
  button{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 13px;
    padding: 9px 16px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease;
  }
  button:hover{ background: #212B35; }
  button:focus-visible{ outline: 2px solid var(--disponible); outline-offset:2px; }
  button.primary{ background: var(--disponible); color: #08211A; border-color: var(--disponible); }
  button.primary:hover{ filter: brightness(1.08); }
  button:disabled{ opacity: .4; cursor:not-allowed; }

  .layout{
    display:grid;
    grid-template-columns: 1.6fr 1fr;
    gap: 18px;
    align-items:start;
  }
  @media (max-width: 900px){
    .layout{ grid-template-columns: 1fr; }
  }

  .panel{
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }
  .panel h2{
    font-size: 13px;
    text-transform: none;
    color: var(--muted);
    margin: 0 0 12px 0;
    font-weight: 600;
    letter-spacing: .2px;
  }

  .stage{
    position: relative;
    min-height: 340px;
    padding: 10px 10px 4px 64px;
  }

  .gate{
    position:absolute;
    left: 6px; top: 50%;
    transform: translateY(-50%);
    width: 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }
  .gate .bar{
    width: 34px; height: 6px;
    background: var(--muted);
    border-radius: 3px;
  }
  .gate .label{
    font-family:'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    text-align:center;
  }

  .bays-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
    gap: 8px;
  }

  .bay{
    aspect-ratio: 1 / 1;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap: 2px;
    transition: background-color .35s ease, border-color .35s ease;
    position: relative;
  }
  .bay .id{
    font-family:'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
  }
  .bay .plate{
    font-family:'JetBrains Mono', monospace;
    font-size: 9px;
    font-weight: 600;
    color: var(--text);
    max-width: 90%;
    overflow:hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .bay.disponible{ background: rgba(63,207,142,.10); border-color: rgba(63,207,142,.35); }
  .bay.disponible .id{ color: var(--disponible); }
  .bay.reservada{ background: rgba(232,166,61,.14); border-color: rgba(232,166,61,.45); }
  .bay.reservada .id{ color: var(--reservada); }
  .bay.ocupada{ background: rgba(228,81,79,.16); border-color: rgba(228,81,79,.5); }
  .bay.ocupada .id{ color: var(--ocupada); }

  .car{
    position:absolute;
    width: 20px; height: 11px;
    z-index: 5;
    transition: left .9s cubic-bezier(.4,.1,.3,1), top .9s cubic-bezier(.4,.1,.3,1);
    pointer-events:none;
  }
  .car svg{ width:100%; height:100%; display:block; }

  .stats{
    display:flex;
    gap: 22px;
    flex-wrap: wrap;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
  }
  .stats .stat{ display:flex; align-items:center; gap:7px; }
  .stats .swatch{ width:9px; height:9px; border-radius:2px; }
  .stats .num{ color: var(--text); font-weight:600; }
  .stats .lab{ color: var(--muted); }

  .lcd-wrap{
    background: #05100C;
    border-radius: 8px;
    padding: 10px;
    border: 1px solid var(--border);
    margin-bottom: 14px;
  }
  .lcd{
    background: var(--lcd-bg);
    border-radius: 4px;
    padding: 12px 14px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--lcd-text);
    font-size: 15px;
    line-height: 1.7;
    letter-spacing: 1px;
    text-shadow: 0 0 6px rgba(140,255,193,.35);
    min-height: 56px;
  }
  .lcd .l2{ color: #6fe0a8; opacity:.85; }

  .log{
    height: 430px;
    overflow-y: auto;
    display:flex;
    flex-direction: column-reverse;
    gap: 8px;
    padding-right: 2px;
  }
  .log::-webkit-scrollbar{ width:7px; }
  .log::-webkit-scrollbar-thumb{ background: #2A3540; border-radius: 4px; }

  .entry{
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--muted);
    border-radius: 6px;
    padding: 8px 10px;
  }
  .entry .title{
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    font-weight: 600;
    margin-bottom: 4px;
    letter-spacing: .2px;
  }
  .entry pre{
    margin:0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: #B7C2CC;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .entry.cyan{ border-left-color:#4FC3E8; } .entry.cyan .title{ color:#4FC3E8; }
  .entry.red{ border-left-color: var(--ocupada); } .entry.red .title{ color: var(--ocupada); }
  .entry.green{ border-left-color: var(--disponible); } .entry.green .title{ color: var(--disponible); }
  .entry.yellow{ border-left-color: var(--reservada); } .entry.yellow .title{ color: var(--reservada); }
  .entry.magenta{ border-left-color:#D77BE0; } .entry.magenta .title{ color:#D77BE0; }
  .entry.gray{ border-left-color: var(--muted); } .entry.gray .title{ color: var(--muted); }
</style>
</head>
<body>
<div class="app">

  <header>
    <h1>Parqueadero Inteligente <span>Nodo PARKING-001</span></h1>
    <div class="live" id="live-indicator"><span class="dot"></span><span id="live-text">Detenido</span></div>
  </header>

  <div class="controls">
    <div class="field">
      <label>Bahías (aplica al Reiniciar)</label>
      <input type="number" id="input-bahias" min="6" max="60" value="30">
    </div>
    <div class="field">
      <label>Vehículos por minuto: <span class="val" id="val-spawn">12</span></label>
      <input type="range" id="input-spawn" min="2" max="40" value="12">
    </div>
    <div class="field">
      <label>% con reserva: <span class="val" id="val-reserva">40</span>%</label>
      <input type="range" id="input-reserva" min="0" max="100" value="40">
    </div>
    <div class="field">
      <label>Velocidad (rápido ← → lento): <span class="val" id="val-velocidad">1.0x</span></label>
      <input type="range" id="input-velocidad" min="0.3" max="2.5" step="0.1" value="1.0">
    </div>
    <div class="buttons">
      <button class="primary" id="btn-start">Iniciar</button>
      <button id="btn-pause" disabled>Pausar</button>
      <button id="btn-reset">Reiniciar</button>
    </div>
  </div>

  <div class="layout">
    <div class="panel">
      <h2>Planta del parqueadero</h2>
      <div class="stage" id="stage">
        <div class="gate" id="gate">
          <div class="bar"></div>
          <div class="label">GATE</div>
        </div>
        <div class="bays-grid" id="bays-grid"></div>
      </div>
      <div class="stats" id="stats">
        <div class="stat"><span class="swatch" style="background:var(--disponible)"></span><span class="num" id="stat-disp">0</span><span class="lab">disponibles</span></div>
        <div class="stat"><span class="swatch" style="background:var(--reservada)"></span><span class="num" id="stat-res">0</span><span class="lab">reservadas</span></div>
        <div class="stat"><span class="swatch" style="background:var(--ocupada)"></span><span class="num" id="stat-ocu">0</span><span class="lab">ocupadas</span></div>
        <div class="stat"><span class="lab">entradas</span><span class="num" id="stat-entradas">0</span></div>
        <div class="stat"><span class="lab">salidas</span><span class="num" id="stat-salidas">0</span></div>
        <div class="stat"><span class="lab">rechazados (sin espacio)</span><span class="num" id="stat-rechazados">0</span></div>
      </div>
    </div>

    <div class="panel">
      <h2>Terminal de acceso (LCD)</h2>
      <div class="lcd-wrap">
        <div class="lcd">
          <div class="l1" id="lcd-l1">A:Placa  B:Reser</div>
          <div class="l2" id="lcd-l2">Presione A o B..</div>
        </div>
      </div>
      <h2>Eventos en vivo</h2>
      <div class="log" id="log"></div>
    </div>
  </div>

</div>

<script>
const NODE_ID = "PARKING-001";

// ---------------------------------------------------------------
// Utilidades
// ---------------------------------------------------------------
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }
function rand(min, max){ return Math.random() * (max - min) + min; }
function nowIso(){
  // Aproximación visual del formato ISO8601 con microsegundos que usa el ESP32.
  const d = new Date();
  return d.toISOString().replace('Z', '000+00:00');
}
function generarPlaca(){
  const letras = Array.from({length:3}, () => String.fromCharCode(65 + Math.floor(Math.random()*26))).join('');
  const numeros = Array.from({length:3}, () => Math.floor(Math.random()*10)).join('');
  return letras + numeros;
}
function generarReservaId(){
  return 'RES-' + Math.floor(100000 + Math.random()*900000);
}

class Mutex{
  constructor(){ this._locked = false; this._queue = []; }
  lock(){
    return new Promise(resolve => {
      if(!this._locked){ this._locked = true; resolve(); }
      else this._queue.push(resolve);
    });
  }
  unlock(){
    if(this._queue.length > 0){ const next = this._queue.shift(); next(); }
    else this._locked = false;
  }
}

// ---------------------------------------------------------------
// Estado global de la simulación
// ---------------------------------------------------------------
let CONFIG = { bahias: 30, spawnPerMin: 12, reservaProb: 0.4, velocidad: 1.0 };
let running = false;
let bahias = [];         // {id, estado, placa, reservationId}
let reservas = {};       // reservationId -> {plate, active}
let stats = { entradas:0, salidas:0, rechazados:0 };
const gateMutex = new Mutex();
let spawnTimeoutId = null;
let generation = 0;      // se incrementa en cada Reiniciar para invalidar vehículos "viejos"

function sleepScaled(min, max){ return sleep(rand(min, max) * CONFIG.velocidad); }

// ---------------------------------------------------------------
// DOM: grid de bahías
// ---------------------------------------------------------------
const gridEl = document.getElementById('bays-grid');
const stageEl = document.getElementById('stage');
const gateEl = document.getElementById('gate');

function construirGrid(n){
  gridEl.innerHTML = '';
  bahias = [];
  for(let i = 1; i <= n; i++){
    const id = 'B-' + String(i).padStart(3, '0');
    bahias.push({ id, estado: 'DISPONIBLE', placa: null, reservationId: null });
    const cell = document.createElement('div');
    cell.className = 'bay disponible';
    cell.id = 'bay-' + id;
    cell.innerHTML = `<div class="id">${String(i).padStart(2,'0')}</div><div class="plate"></div>`;
    gridEl.appendChild(cell);
  }
  actualizarStats();
}

function actualizarBahiaDOM(bahia){
  const el = document.getElementById('bay-' + bahia.id);
  if(!el) return;
  el.className = 'bay ' + bahia.estado.toLowerCase();
  el.querySelector('.plate').textContent = bahia.placa || (bahia.estado === 'RESERVADA' ? '· · ·' : '');
  actualizarStats();
}

function actualizarStats(){
  const disp = bahias.filter(b => b.estado === 'DISPONIBLE').length;
  const res  = bahias.filter(b => b.estado === 'RESERVADA').length;
  const ocu  = bahias.filter(b => b.estado === 'OCUPADA').length;
  document.getElementById('stat-disp').textContent = disp;
  document.getElementById('stat-res').textContent = res;
  document.getElementById('stat-ocu').textContent = ocu;
  document.getElementById('stat-entradas').textContent = stats.entradas;
  document.getElementById('stat-salidas').textContent = stats.salidas;
  document.getElementById('stat-rechazados').textContent = stats.rechazados;
}

// ---------------------------------------------------------------
// Operaciones atómicas sobre las bahías
// ---------------------------------------------------------------
function hayBahiaDisponible(){ return bahias.some(b => b.estado === 'DISPONIBLE'); }

function reservarBahiaLibre(reservationId){
  const b = bahias.find(b => b.estado === 'DISPONIBLE');
  if(!b) return null;
  b.estado = 'RESERVADA'; b.reservationId = reservationId;
  actualizarBahiaDOM(b);
  return b;
}
function ocuparBahiaReservada(reservationId, placa){
  const b = bahias.find(b => b.estado === 'RESERVADA' && b.reservationId === reservationId);
  if(!b) return null;
  b.estado = 'OCUPADA'; b.placa = placa;
  actualizarBahiaDOM(b);
  return b;
}
function ocuparBahiaLibre(placa){
  const b = bahias.find(b => b.estado === 'DISPONIBLE');
  if(!b) return null;
  b.estado = 'OCUPADA'; b.placa = placa;
  actualizarBahiaDOM(b);
  return b;
}
function buscarPorPlacaOcupada(placa){
  return bahias.find(b => b.estado === 'OCUPADA' && b.placa === placa) || null;
}
function liberarBahia(b){
  b.estado = 'DISPONIBLE'; b.placa = null; b.reservationId = null;
  actualizarBahiaDOM(b);
}

// ---------------------------------------------------------------
// LCD del gate
// ---------------------------------------------------------------
function setLCD(l1, l2 = ''){
  document.getElementById('lcd-l1').textContent = l1;
  document.getElementById('lcd-l2').textContent = l2;
}

// ---------------------------------------------------------------
// Log de eventos JSON
// ---------------------------------------------------------------
const logEl = document.getElementById('log');
let logCount = 0;
function pushLog(titulo, data, clase){
  const div = document.createElement('div');
  div.className = 'entry ' + clase;
  div.innerHTML = `<div class="title">${titulo}</div><pre>${JSON.stringify(data, null, 2)}</pre>`;
  logEl.appendChild(div);
  logCount++;
  if(logCount > 150){ logEl.removeChild(logEl.firstChild); logCount--; }
  logEl.scrollTop = logEl.scrollHeight;
}

// ---------------------------------------------------------------
// Animación de autos entre el gate y una bahía
// ---------------------------------------------------------------
function posRelativa(el){
  const stageRect = stageEl.getBoundingClientRect();
  const r = el.getBoundingClientRect();
  return {
    left: r.left - stageRect.left + (r.width - 20) / 2,
    top:  r.top  - stageRect.top  + (r.height - 11) / 2
  };
}
const CAR_SVG = `<svg viewBox="0 0 20 11" xmlns="http://www.w3.org/2000/svg">
  <rect x="1" y="2" width="18" height="6" rx="2.5" fill="#EDEFF2"/>
  <rect x="5" y="0" width="9" height="4" rx="1.5" fill="#EDEFF2"/>
  <circle cx="5.5" cy="8.5" r="1.7" fill="#161D24"/>
  <circle cx="14.5" cy="8.5" r="1.7" fill="#161D24"/>
</svg>`;

function animarAuto(fromEl, toEl, direccion){
  return new Promise(resolve => {
    const car = document.createElement('div');
    car.className = 'car';
    car.innerHTML = CAR_SVG;
    if(direccion === 'out') car.style.transform = 'scaleX(-1)';
    stageEl.appendChild(car);

    const from = posRelativa(fromEl);
    car.style.left = from.left + 'px';
    car.style.top = from.top + 'px';

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        const to = posRelativa(toEl);
        car.style.left = to.left + 'px';
        car.style.top = to.top + 'px';
      });
    });

    const dur = 900 * CONFIG.velocidad;
    setTimeout(() => { car.remove(); resolve(); }, dur + 30);
  });
}

// ---------------------------------------------------------------
// "Servidor" de reservas
// ---------------------------------------------------------------
function crearReserva(placa){
  const id = generarReservaId();
  reservas[id] = { plate: placa, active: true };
  return id;
}

// ---------------------------------------------------------------
// Lógica de la terminal de acceso (equivalente al ESP32)
// ---------------------------------------------------------------
async function procesarVehiculo(v, gen){
  await gateMutex.lock();
  try{
    if(gen !== generation) return null;
    setLCD(`Placa: ${v.placa}`, v.reservationId ? 'Cod. Reserva:' : 'Ingresar Placa:');
    await sleepScaled(150, 400);

    if(v.reservationId) return await procesarReserva(v, gen);

    const bahiaActual = buscarPorPlacaOcupada(v.placa);
    if(bahiaActual) return await procesarSalida(v, bahiaActual, gen);

    return await procesarPlacaEntrada(v, gen);
  } finally {
    gateMutex.unlock();
  }
}

async function procesarReserva(v, gen){
  setLCD('Validando...', 'Consultando server');
  await sleepScaled(150, 300);
  if(gen !== generation) return null;

  const reserva = reservas[v.reservationId];
  if(reserva && reserva.active){
    setLCD('Reserva OK', 'Pase por Sensor1');
    return await entrada(v, true, gen);
  }

  setLCD('Error Reserva', 'Invalida/Inactiva');
  pushLog('MENSAJE', { mensaje: 'Reserva inválida o inactiva', plate: v.placa, reservation_id: v.reservationId }, 'gray');
  await sleepScaled(400, 700);
  return null;
}

async function procesarPlacaEntrada(v, gen){
  // Sin reserva: solo se deja pasar si hay al menos una bahía DISPONIBLE.
  if(!hayBahiaDisponible()){
    setLCD('Sin Espacio', 'Parqueadero Lleno');
    stats.rechazados++; actualizarStats();
    pushLog('ACCESO DENEGADO', { plate: v.placa, motivo: 'parqueadero_lleno' }, 'gray');
    await sleepScaled(500, 800);
    return null;
  }
  setLCD('Placa Aceptada', 'Pase por Sensor1');
  return await entrada(v, false, gen);
}

async function entrada(v, esReserva, gen){
  await sleepScaled(300, 700); // tiempo pasando por el sensor de entrada
  if(gen !== generation) return null;

  const evento = {
    event: 'vehicle_access', node_id: NODE_ID, access_type: 'entry',
    reservation: esReserva, reservation_id: esReserva ? v.reservationId : null,
    plate: v.placa, date: nowIso()
  };
  pushLog('EVENTO ACCESO (ENTRADA)', evento, 'cyan');
  stats.entradas++; actualizarStats();

  let bahia = null;
  if(esReserva) bahia = ocuparBahiaReservada(v.reservationId, v.placa);
  if(!bahia) bahia = ocuparBahiaLibre(v.placa);

  if(!bahia){
    setLCD('Sin Bahia', 'Vehiculo se retira');
    return null;
  }

  await animarAuto(gateEl, document.getElementById('bay-' + bahia.id), 'in');
  await sleepScaled(300, 600); // confirmación del sensor de bahía
  if(gen !== generation) return bahia;

  const eventoBahia = {
    event: 'parking_space_status', node_id: NODE_ID, space_id: bahia.id,
    status: 'occupied', plate: v.placa, reservation_id: esReserva ? v.reservationId : null,
    date: nowIso()
  };
  pushLog(`EVENTO BAHÍA ${bahia.id} → OCUPADA`, eventoBahia, 'red');

  if(esReserva && reservas[v.reservationId]) reservas[v.reservationId].active = false;

  setLCD('Acceso Exitoso', 'Pase Adelante');
  return bahia;
}

async function procesarSalida(v, bahia, gen){
  setLCD('Salida Aceptada', 'Pase por Sensor2');
  await animarAuto(document.getElementById('bay-' + bahia.id), gateEl, 'out');
  if(gen !== generation) return bahia;

  const evento = {
    event: 'vehicle_access', node_id: NODE_ID, access_type: 'exit',
    reservation: false, reservation_id: null, plate: v.placa, date: nowIso()
  };
  pushLog('EVENTO ACCESO (SALIDA)', evento, 'magenta');
  stats.salidas++; actualizarStats();

  liberarBahia(bahia);
  await sleepScaled(300, 600); // confirmación del sensor de bahía
  if(gen !== generation) return bahia;

  const eventoBahia = {
    event: 'parking_space_status', node_id: NODE_ID, space_id: bahia.id,
    status: 'available', plate: null, reservation_id: null, date: nowIso()
  };
  pushLog(`EVENTO BAHÍA ${bahia.id} → DISPONIBLE`, eventoBahia, 'green');

  setLCD('Vehiculo Saliendo', 'Buen Viaje!');
  return bahia;
}

// ---------------------------------------------------------------
// Ciclo de vida de cada vehículo
// ---------------------------------------------------------------
async function vidaVehiculo(gen){
  const placa = generarPlaca();
  let reservationId = null;

  if(Math.random() < CONFIG.reservaProb){
    reservationId = crearReserva(placa);
    const bahiaReservada = reservarBahiaLibre(reservationId);
    pushLog('RESERVA CREADA', {
      evento: 'reserva_creada',
      node_id: NODE_ID,
      reservation_id: reservationId,
      placa: placa,
      id_bahia: bahiaReservada ? bahiaReservada.id : null,
      date: nowIso()
    }, 'yellow');
    if(bahiaReservada){
      const eventoBahia = {
        event: 'parking_space_status', node_id: NODE_ID, space_id: bahiaReservada.id,
        status: 'reserved', plate: null, reservation_id: reservationId, date: nowIso()
      };
      pushLog(`EVENTO BAHÍA ${bahiaReservada.id} → RESERVADA`, eventoBahia, 'yellow');
    }
    await sleepScaled(500, 1200);
  }

  if(gen !== generation) return;

  const bahia = await procesarVehiculo({ placa, reservationId }, gen);
  if(!bahia || gen !== generation) return;

  await sleep(rand(2500, 6000) * CONFIG.velocidad); // tiempo estacionado
  if(gen !== generation) return;

  await procesarVehiculo({ placa, reservationId: null }, gen);
}

// ---------------------------------------------------------------
// Planificador de llegadas (spawns)
// ---------------------------------------------------------------
function planificarSpawn(gen){
  if(!running || gen !== generation) return;
  vidaVehiculo(gen);
  const intervalMs = (60000 / CONFIG.spawnPerMin) * rand(0.6, 1.4) * CONFIG.velocidad;
  spawnTimeoutId = setTimeout(() => planificarSpawn(gen), intervalMs);
}

// ---------------------------------------------------------------
// Controles UI
// ---------------------------------------------------------------
const inputBahias = document.getElementById('input-bahias');
const inputSpawn = document.getElementById('input-spawn');
const inputReserva = document.getElementById('input-reserva');
const inputVelocidad = document.getElementById('input-velocidad');
const btnStart = document.getElementById('btn-start');
const btnPause = document.getElementById('btn-pause');
const btnReset = document.getElementById('btn-reset');
const liveIndicator = document.getElementById('live-indicator');
const liveText = document.getElementById('live-text');

inputSpawn.addEventListener('input', () => {
  CONFIG.spawnPerMin = Number(inputSpawn.value);
  document.getElementById('val-spawn').textContent = CONFIG.spawnPerMin;
});
inputReserva.addEventListener('input', () => {
  CONFIG.reservaProb = Number(inputReserva.value) / 100;
  document.getElementById('val-reserva').textContent = inputReserva.value;
});
inputVelocidad.addEventListener('input', () => {
  CONFIG.velocidad = Number(inputVelocidad.value);
  document.getElementById('val-velocidad').textContent = CONFIG.velocidad.toFixed(1) + 'x';
});

function setRunningUI(isRunning){
  btnStart.disabled = isRunning;
  btnPause.disabled = !isRunning;
  inputBahias.disabled = isRunning;
  liveIndicator.classList.toggle('on', isRunning);
  liveText.textContent = isRunning ? 'En vivo' : 'Detenido';
}

btnStart.addEventListener('click', () => {
  if(running) return;
  running = true;
  setRunningUI(true);
  setLCD('A:Placa  B:Reser', 'Presione A o B..');
  planificarSpawn(generation);
});

btnPause.addEventListener('click', () => {
  running = false;
  clearTimeout(spawnTimeoutId);
  setRunningUI(false);
});

btnReset.addEventListener('click', () => {
  running = false;
  clearTimeout(spawnTimeoutId);
  generation++; // invalida cualquier vehículo/animación en curso
  reservas = {};
  stats = { entradas:0, salidas:0, rechazados:0 };
  logEl.innerHTML = '';
  logCount = 0;
  document.querySelectorAll('.car').forEach(c => c.remove());
  const n = Math.max(6, Math.min(60, Number(inputBahias.value) || 30));
  inputBahias.value = n;
  CONFIG.bahias = n;
  construirGrid(n);
  setLCD('A:Placa  B:Reser', 'Presione A o B..');
  setRunningUI(false);
});

// ---------------------------------------------------------------
// Inicialización
// ---------------------------------------------------------------
CONFIG.spawnPerMin = Number(inputSpawn.value);
CONFIG.reservaProb = Number(inputReserva.value) / 100;
CONFIG.velocidad = Number(inputVelocidad.value);
construirGrid(CONFIG.bahias);
setLCD('A:Placa  B:Reser', 'Presione A o B..');
</script>
</body>
